name: Job lifecycle tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: job_lifecycle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m unittest discover -s scripts -p 'test_job_*.py'
      - run: node scripts/test-job-lifecycle-db.mjs
        env:
          JOB_LIFECYCLE_TEST_DB: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/job_lifecycle_test
